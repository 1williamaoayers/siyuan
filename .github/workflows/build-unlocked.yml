# 思源笔记解锁版自动构建
name: 构建解锁版

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: 安装 pnpm
        run: npm install -g pnpm
        
      - name: 安装前端依赖
        run: cd app && pnpm install --no-frozen-lockfile
        
      - name: 构建前端
        run: cd app && pnpm run build
        
      - name: 清理旧内核目录
        run: rm -rf app/kernel-linux app/build
        
      - name: 构建内核
        run: |
          cd kernel
          go build --tags fts5 -o "../app/kernel-linux/SiYuan-Kernel" -v -ldflags "-s -w"
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
          
      - name: 打包 AppImage
        run: cd app && pnpm run dist-linux
        
      - uses: actions/upload-artifact@v4
        with:
          name: siyuan-linux-unlocked
          path: |
            app/build/*.AppImage
            app/build/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: msys2/setup-msys2@v2
        with:
          install: p7zip mingw-w64-x86_64-lua
          
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: 安装 pnpm
        run: npm install -g pnpm
        
      - name: 安装前端依赖
        run: cd app && pnpm install --no-frozen-lockfile
        
      - name: 构建前端
        run: cd app && pnpm run build
        
      - name: 清理旧内核目录
        run: Remove-Item -Recurse -Force app/kernel -ErrorAction SilentlyContinue
        
      - name: 构建内核
        run: |
          cd kernel
          $env:CGO_ENABLED = "1"
          go build --tags fts5 -o "../app/kernel/SiYuan-Kernel.exe" -v -ldflags "-s -w -H windowsgui"
          
      - name: 打包 exe
        run: cd app && pnpm run dist
        
      - uses: actions/upload-artifact@v4
        with:
          name: siyuan-windows-unlocked
          path: app/build/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/checkout@v4
        with:
          repository: siyuan-note/siyuan-android
          path: siyuan-android
          
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: android-actions/setup-android@v3
      
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      
      - name: 安装 pnpm
        run: npm install -g pnpm
        
      - name: 安装 NDK
        run: sdkmanager --install "ndk;26.1.10909125"
        
      - name: 安装前端依赖
        run: cd app && pnpm install --no-frozen-lockfile
        
      - name: 构建前端
        run: cd app && pnpm run build
        
      - name: 安装 gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          
      - name: 构建 Android 内核 (arm64)
        run: |
          cd kernel
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          mkdir -p ../siyuan-android/app/libs
          gomobile bind -v -o ../siyuan-android/app/libs/kernel.aar -target=android/arm64 -androidapi 26 -ldflags "-s -w" -tags fts5 ./mobile
        env:
          CGO_ENABLED: 1
          
      - name: 准备资源文件
        run: |
          mkdir -p siyuan-android/app/src/main/assets
          cd app && zip -r ../siyuan-android/app/src/main/assets/app.zip appearance guide stage changelogs
          
      - name: 构建 APK
        run: |
          cd siyuan-android
          cp signings.templates.gradle signings.gradle
          sed -i 's/storeFile file.*/storeFile file("debug.keystore")/' signings.gradle || true
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && break || sleep 30
          done
          
      - uses: actions/upload-artifact@v4
        with:
          name: siyuan-android-unlocked
          path: siyuan-android/app/build/outputs/apk/**/*.apk

  # 创建 Release 并上传所有构建产物
  release:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: 获取版本号
        id: version
        run: |
          VERSION=$(grep '"version"' app/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
      
      - name: 下载 Linux 构建产物
        uses: actions/download-artifact@v4
        with:
          name: siyuan-linux-unlocked
          path: release/linux
          
      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: siyuan-windows-unlocked
          path: release/windows
          
      - name: 下载 Android 构建产物
        uses: actions/download-artifact@v4
        with:
          name: siyuan-android-unlocked
          path: release/android
          
      - name: 整理文件
        run: |
          mkdir -p release/final
          # Linux
          cp release/linux/*.AppImage release/final/ 2>/dev/null || true
          cp release/linux/*.tar.gz release/final/ 2>/dev/null || true
          # Windows
          cp release/windows/*.exe release/final/ 2>/dev/null || true
          # Android - 只保留 official 版本
          find release/android -name "*official*.apk" -exec cp {} release/final/ \; 2>/dev/null || true
          ls -la release/final/
          
      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}-unlocked-${{ steps.version.outputs.date }}
          name: 思源笔记解锁版 v${{ steps.version.outputs.version }}
          body: |
            ## 思源笔记解锁版 v${{ steps.version.outputs.version }}
            
            **解锁功能**：WebDAV/S3 同步（无需付费）
            
            ### 下载说明
            - **Linux**: AppImage 可直接运行
            - **Windows**: exe 安装包
            - **Android**: APK 安装包（调试版）
            
            ### 注意事项
            - 这是非官方修改版，仅供学习研究
            - 如果觉得好用，请支持官方：https://b3log.org/siyuan/
          files: release/final/*
          draft: false
          prerelease: false
