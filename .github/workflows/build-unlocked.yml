# 思源笔记解锁版自动构建
name: 构建解锁版

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: 安装 pnpm
        run: npm install -g pnpm
        
      - name: 安装前端依赖
        run: cd app && pnpm install --no-frozen-lockfile
        
      - name: 构建前端
        run: cd app && pnpm run build
        
      - name: 清理旧内核目录
        run: rm -rf app/kernel-linux app/build
        
      - name: 构建内核
        run: |
          cd kernel
          go build --tags fts5 -o "../app/kernel-linux/SiYuan-Kernel" -v -ldflags "-s -w"
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
          
      - name: 打包 AppImage
        run: cd app && pnpm run dist-linux
        
      - uses: actions/upload-artifact@v4
        with:
          name: siyuan-linux-unlocked
          path: |
            app/build/*.AppImage
            app/build/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: msys2/setup-msys2@v2
        with:
          install: p7zip mingw-w64-x86_64-lua
          
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: 安装 pnpm
        run: npm install -g pnpm
        
      - name: 安装前端依赖
        run: cd app && pnpm install --no-frozen-lockfile
        
      - name: 构建前端
        run: cd app && pnpm run build
        
      - name: 清理旧内核目录
        run: Remove-Item -Recurse -Force app/kernel -ErrorAction SilentlyContinue
        
      - name: 构建内核
        run: |
          cd kernel
          $env:CGO_ENABLED = "1"
          go build --tags fts5 -o "../app/kernel/SiYuan-Kernel.exe" -v -ldflags "-s -w -H windowsgui"
          
      - name: 打包 exe
        run: cd app && pnpm run dist
        
      - uses: actions/upload-artifact@v4
        with:
          name: siyuan-windows-unlocked
          path: app/build/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/checkout@v4
        with:
          repository: siyuan-note/siyuan-android
          path: siyuan-android
          
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: android-actions/setup-android@v3
      
      - name: 安装 pnpm
        run: npm install -g pnpm
        
      - name: 安装 NDK
        run: sdkmanager --install "ndk;26.1.10909125"
        
      - name: 安装前端依赖
        run: cd app && pnpm install --no-frozen-lockfile
        
      - name: 构建前端
        run: cd app && pnpm run build
        
      - name: 安装 gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          
      - name: 构建 Android 内核 (arm64)
        run: |
          cd kernel
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          mkdir -p ../siyuan-android/app/libs
          gomobile bind -v -o ../siyuan-android/app/libs/kernel.aar -target=android/arm64 -androidapi 26 -ldflags "-s -w" -tags fts5 ./mobile
        env:
          CGO_ENABLED: 1
          
      - name: 准备资源文件
        run: |
          mkdir -p siyuan-android/app/src/main/assets
          cd app && zip -r ../siyuan-android/app/src/main/assets/app.zip appearance guide stage changelogs
          
      - name: 构建 APK
        run: |
          cd siyuan-android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
      - uses: actions/upload-artifact@v4
        with:
          name: siyuan-android-unlocked
          path: siyuan-android/app/build/outputs/apk/**/*.apk
